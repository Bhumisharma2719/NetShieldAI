services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      POSTGRES_DB: netshield_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Bhumi@27
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d netshield_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    environment:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      BACKEND_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      SNIFFER_IFACE: ${SNIFFER_IFACE:-}
    privileged: true
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    command:
      - sh
      - -c
      - |
        if [ -n "$$SNIFFER_IFACE" ]; then
          python ml_core/live_sniffer.py --iface "$$SNIFFER_IFACE" --interval 2.5 --top 12 &
        else
          python ml_core/live_sniffer.py --interval 2.5 --top 12 &
        fi
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:8000/api
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
